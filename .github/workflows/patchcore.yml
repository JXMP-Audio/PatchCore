name: patchcore

# PatchCore builds: the standalone app and the VST3 plugins (PatchCore, PatchCore FX) for Linux x86_64 and
# Windows 64-bit. Started by hand only (Actions tab → patchcore → Run workflow, or `gh workflow run patchcore`):
# the user decides when a build runs. Every successful build is published as a GitHub release.
on:
  workflow_dispatch:

env:
  CACHE_VERSION: 1
  CIBUILD: true
  DEBIAN_FRONTEND: noninteractive
  LIBGL_ALWAYS_SOFTWARE: true
  PAWPAW_CI: 1
  PAWPAW_FAST_MATH: 1
  PAWPAW_SKIP_GLIB: 1
  PAWPAW_SKIP_LTO: 1
  PAWPAW_SKIP_LV2: 1
  PAWPAW_SKIP_OPENSSL: 1
  PAWPAW_SKIP_SAMPLERATE: 1
  PAWPAW_SKIP_TESTS: 1

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - name: Use GitHub mirrors for flaky submodule hosts
        # gitlab.xiph.org often answers 502/504; xiph's official GitHub mirror has the same commits
        run: git config --global url."https://github.com/xiph/speexdsp.git".insteadOf "https://gitlab.xiph.org/xiph/speexdsp.git"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up dependencies
        run: |
          sudo apt-get update -qq
          # no liblo-dev: OSC remote control is off in PatchCore, and the plugin must not need liblo on the user's system
          sudo apt-get install -yqq libasound2-dev libdbus-1-dev libgl1-mesa-dev libsdl2-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev libjansson-dev gperf meson
          sudo apt-get clean
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-linux-x86_64-v${{ env.CACHE_VERSION }}
      - name: Build
        env:
          LDFLAGS: -static-libgcc -static-libstdc++
        run: |
          export PATH="/usr/lib/ccache:${PATH}"
          make features
          make carla deps dgl plugins resources -j $(nproc)
          # the final stages one job at a time, else the runner may run out of memory
          make HAVE_PULSEAUDIO=false jack -j 1
          make HAVE_PULSEAUDIO=false vst3 -j 1
      - name: Pack
        run: |
          echo "SHA8=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
          mkdir -p dist/PatchCore
          # the Cardinal build names become PatchCore names (a VST3 binary must be named like its bundle)
          cp -L bin/Cardinal dist/PatchCore/PatchCore
          cp -rL bin/CardinalSynth.vst3 dist/PatchCore/PatchCore.vst3
          mv dist/PatchCore/PatchCore.vst3/Contents/x86_64-linux/CardinalSynth.so dist/PatchCore/PatchCore.vst3/Contents/x86_64-linux/PatchCore.so
          cp -rL bin/CardinalFX.vst3 dist/PatchCore/PatchCoreFX.vst3
          mv dist/PatchCore/PatchCoreFX.vst3/Contents/x86_64-linux/CardinalFX.so dist/PatchCore/PatchCoreFX.vst3/Contents/x86_64-linux/PatchCoreFX.so
          cp -rL bin/CardinalSynth.vst3/Contents/Resources dist/PatchCore/resources  # the standalone finds it next to itself
          cp LICENSE README.md docs/LICENSES.md dist/PatchCore/  # LICENSES.md: the licences and authors of the bundled modules
          # JX-NEST finds plugins with Carla's scanner, shipped in the JXMP resources: the release must have it
          for d in dist/PatchCore/resources dist/PatchCore/PatchCore.vst3/Contents/Resources dist/PatchCore/PatchCoreFX.vst3/Contents/Resources; do
            test -x "$d/JXMP/res/carla/carla-discovery-native" || { echo "carla-discovery missing in $d"; exit 1; }
          done
          tar -c -J -f PatchCore-linux-x86_64-$(echo ${{ github.sha }} | cut -c1-8).tar.xz -C dist PatchCore
      - uses: actions/upload-artifact@v4
        with:
          name: PatchCore-linux-x86_64-${{ env.SHA8 }}
          path: '*.tar.xz'

  windows-x86_64:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    env:
      # Carla's Qt/Python frontend is not needed (PatchCore uses only the Carla backend) and it needs wine, which
      # does not run in this container ("wine: socket: Function not implemented")
      PAWPAW_SKIP_QT: 1
    steps:
      - name: Install git
        run: |
          apt-get update -qq && apt-get install -yqq --no-install-recommends ca-certificates git openssl
      - name: Use GitHub mirrors for flaky submodule hosts
        # gitlab.xiph.org often answers 502/504; xiph's official GitHub mirror has the same commits
        run: git config --global url."https://github.com/xiph/speexdsp.git".insteadOf "https://gitlab.xiph.org/xiph/speexdsp.git"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: |
            ~/PawPawBuilds
            src/Rack/dep/bin
            src/Rack/dep/include
            src/Rack/dep/lib
            src/Rack/dep/share
            src/Rack/dep/jansson-2.12
            src/Rack/dep/libarchive-3.4.3
            src/Rack/dep/libsamplerate-0.1.9
            src/Rack/dep/zstd-1.4.5
          key: win64-v${{ env.CACHE_VERSION }}
      - name: Set up dependencies
        run: |
          ./deps/PawPaw/.github/workflows/bootstrap-deps.sh win64
          apt-get install -yqq wget xvfb zip
          apt-get clean
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-win64-v${{ env.CACHE_VERSION }}
      - name: Build extra dependencies
        run: |
          ./deps/PawPaw/bootstrap-cardinal.sh win64 && ./deps/PawPaw/.cleanup.sh win64
      - name: Build (cross-compiled)
        shell: bash
        run: |
          export PATH="/usr/lib/ccache:${PATH}"
          source deps/PawPaw/local.env win64
          make features
          # only what PatchCore ships: the standalone and the VST3 plugins (not the Mini variant, not LV2/CLAP)
          xvfb-run make NOOPT=true carla deps dgl plugins resources -j $(nproc)
          xvfb-run make NOOPT=true jack -j 2
          xvfb-run make NOOPT=true vst3 -j 2
      - name: Pack
        shell: bash
        run: |
          echo "SHA8=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
          mkdir -p dist/PatchCore
          # the Cardinal build names become PatchCore names (a VST3 binary must be named like its bundle)
          cp -L bin/Cardinal.exe dist/PatchCore/PatchCore.exe
          cp -rL bin/CardinalSynth.vst3 dist/PatchCore/PatchCore.vst3
          mv dist/PatchCore/PatchCore.vst3/Contents/x86_64-win/CardinalSynth.vst3 dist/PatchCore/PatchCore.vst3/Contents/x86_64-win/PatchCore.vst3
          cp -rL bin/CardinalFX.vst3 dist/PatchCore/PatchCoreFX.vst3
          mv dist/PatchCore/PatchCoreFX.vst3/Contents/x86_64-win/CardinalFX.vst3 dist/PatchCore/PatchCoreFX.vst3/Contents/x86_64-win/PatchCoreFX.vst3
          cp -rL bin/CardinalSynth.vst3/Contents/Resources dist/PatchCore/resources  # the standalone finds it next to itself
          cp LICENSE README.md docs/LICENSES.md dist/PatchCore/  # LICENSES.md: the licences and authors of the bundled modules
          # JX-NEST finds plugins with Carla's scanner, shipped in the JXMP resources: the release must have it
          for d in dist/PatchCore/resources dist/PatchCore/PatchCore.vst3/Contents/Resources dist/PatchCore/PatchCoreFX.vst3/Contents/Resources; do
            test -f "$d/JXMP/res/carla/carla-discovery-native.exe" || { echo "carla-discovery missing in $d"; exit 1; }
          done
          cd dist && zip -r -9 ../PatchCore-windows-x86_64-$(echo ${{ github.sha }} | cut -c1-8).zip PatchCore
      - uses: actions/upload-artifact@v4
        with:
          name: PatchCore-windows-x86_64-${{ env.SHA8 }}
          path: '*.zip'

  release:
    needs: [linux-x86_64, windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA8=$(echo ${{ github.sha }} | cut -c1-8)
          TAG="v$(date -u +%Y.%m.%d)-${SHA8}"
          gh release create "$TAG" dist/* --repo ${{ github.repository }} --target ${{ github.sha }} --title "PatchCore $TAG" \
            --notes "PatchCore build of ${{ github.sha }}. Linux x86_64 (.tar.xz) and Windows 64-bit (.zip): the PatchCore app, PatchCore.vst3 (instrument) and PatchCoreFX.vst3 (effect)."
